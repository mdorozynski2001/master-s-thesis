[tool.poetry]
name = "praca-magisterska"
version = "0.1.0"
description = ""
authors = ["Marcin Dorożyński <259295@student.pwr.edu.pl>"]
readme = "README.md"
packages = [
    { include = "yolo_trainer", from = "src" },
    { include = "custom_trainer", from = "src" },
]

[tool.poetry.scripts]
train = "yolo_trainer.train.train:main"
evaluate_single = "yolo_trainer.post_train.evaluate_single:main"
evaluate_splitted_dataset = "yolo_trainer.post_train.evaluate_splitted_dataset:main"
compare_models = "yolo_trainer.post_train.compare_models:main"
remove_symlinks = "yolo_trainer.remove_symlinks:main"
init_datasets = "yolo_trainer.pre_train.init_datasets:main"
create_yolo_yamls = "yolo_trainer.pre_train.create_yolo_yamls:main"
train_custom = "custom_trainer.train_custom_model:main"
eval_custom = "custom_trainer.evaluate_custom_model:main"
compare_custom = "custom_trainer.compare_custom_models:main"

[tool.poetry.dependencies]
python = "^3.10"
ultralytics = "^8.3.49"
typer = "^0.15.1"
munch = "^4.0.0"
plotly = "^5.24.1"
scikit-learn = "^1.6.1"

[tool.poetry.group.test.dependencies]
black = "^24.10.0"
flake8 = "^7.1.1"
isort = "^5.13.2"
mypy = "^1.12.1"
pre-commit = "^4.0.1"
pre-commit-hooks = "^5.0.0"
types-tqdm = "^4.67.0.20250301"
types-pyyaml = "^6.0.12.20241230"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
