[tool.poetry]
name = "praca-magisterska"
version = "0.1.0"
description = ""
authors = ["Marcin Dorożyński <259295@student.pwr.edu.pl>"]
readme = "README.md"
packages = [
    { include = "yolov8_trainer", from = "src" },
]

[tool.poetry.scripts]
train = "yolov8_trainer.train.train:main"
evaluate = "yolov8_trainer.post_train.evaluate:main"
remove_symlinks = "yolov8_trainer.remove_symlinks:main"
init_datasets = "yolov8_trainer.pre_train.init_datasets:main"

[tool.poetry.dependencies]
python = "^3.10"
ultralytics = "^8.3.49"
typer = "^0.15.1"
munch = "^4.0.0"

[tool.poetry.group.test.dependencies]
black = "^24.10.0"
flake8 = "^7.1.1"
isort = "^5.13.2"
mypy = "^1.12.1"
pre-commit = "^4.0.1"
pre-commit-hooks = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
